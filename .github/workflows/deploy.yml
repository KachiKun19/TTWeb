name: CI/CD - Build and Deploy to Azure

# Trigger: Tự động chạy khi code được push lên nhánh main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Lấy mã nguồn mới nhất từ GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      #  Cài đặt môi trường Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Bộ nhớ đệm Cache Gradle (Tăng tốc độ đóng gói)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Cấp quyền thực thi cho file gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tạo file config.properties từ GitHub Secrets
      - name: Create config.properties
        run: |
          mkdir -p src/main/resources
          echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" > src/main/resources/config.properties
          echo "FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}" >> src/main/resources/config.properties
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> src/main/resources/config.properties
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> src/main/resources/config.properties

      # Đóng gói ứng dụng thành file .war
      - name: Build WAR with Gradle
        run: ./gradlew war -x test --no-daemon

      # Kiểm tra đảm bảo file .war đã được sinh ra
      - name: Verify WAR file exists
        run: ls -lh build/libs/

      # deploy lên azure thông qua azure publish profile
      - name: Deploy WAR to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: 'build/libs/ROOT.war'